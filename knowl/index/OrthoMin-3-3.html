<h2 class="heading"><span class="type">Абзац</span></h2>
<div class="para">Часто возникает следующая задача: по подпространству <span class="process-math">\(U\)</span> пространства <span class="process-math">\(V\)</span> и точке <span class="process-math">\(v \in V{}\)</span> найти точку <span class="process-math">\(u \in U\)</span> такую, что <span class="process-math">\(\|v - u\|\)</span> минимально возможно. Следующий результат показывает, что <span class="process-math">\(u = P_{U} v\)</span> является единственным решением этой задачи минимизации.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#OrthoMin-3-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div></div>
