<span class="type">Определение</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.44</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">изометрия.</span>
</h2>
<div class="para logical">
<div class="para">Линейное отображение <span class="process-math">\(S \in \Lc(V{},W)\)</span> называется <dfn class="terminology">изометрией</dfn>, если</div>
<div class="displaymath process-math">
\begin{equation*}
\| Sv \| = \| v \|
\end{equation*}
</div>
<div class="para">для каждого <span class="process-math">\(v \in V{}\)</span>. Другими словами, линейное отображение является изометрией, если оно сохраняет нормы.</div>
