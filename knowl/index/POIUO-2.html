<span class="type">Определение</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.34</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">положительный оператор.</span>
</h2>
<div class="para logical">
<div class="para">Оператор <span class="process-math">\(T \in \Lc(V)\)</span> называется <dfn class="terminology">положительным</dfn>, если <span class="process-math">\(T\)</span> самосопряжён и</div>
<div class="displaymath process-math">
\begin{equation*}
\langle Tv, v \rangle  \ge 0
\end{equation*}
</div>
<div class="para">для всех <span class="process-math">\(v \in V{}\)</span>.</div>
