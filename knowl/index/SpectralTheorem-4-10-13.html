<div class="para">Предположим, что <span class="process-math">\(V\)</span> — комплексное векторное пространство, а <span class="process-math">\(T \in \Lc(V)\)</span> — нормальное. Докажите, что если <span class="process-math">\(S\)</span> — оператор на <span class="process-math">\(V\)</span>, коммутирующий с <span class="process-math">\(T\)</span>, то <span class="process-math">\(S\)</span> коммутирует с <span class="process-math">\(T^*{}\)</span>. Примечание. Результат этого упражнения называется теоремой Фугледа.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#SpectralTheorem-4-10-13-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div></div>
