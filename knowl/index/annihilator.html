<span class="type">Определение</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.121</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">аннулятор, <span class="process-math">\(U^0\)</span>.</span>
</h2>
<div class="para logical">
<div class="para">Для подмножества <span class="process-math">\(U \subset V{}\)</span> <dfn class="terminology">аннулятором</dfn> множества <span class="process-math">\(U\)</span> (обозначается через <span class="process-math">\(U^0{}\)</span>) называется множество, определяемое формулой</div>
<div class="displaymath process-math">
\begin{equation*}
U^0 = \{ \phi \in V': \phi(u) = 0 \textit{ для всех\ } u \in U \}.
\end{equation*}
</div>
