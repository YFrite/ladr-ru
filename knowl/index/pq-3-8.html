<article class="definition definition-like"><h2 class="heading">
<span class="type">Определение</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.99</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">факторпространство, <span class="process-math">\(V/U\)</span>.</span>
</h2>
<div class="para logical">
<div class="para">Пусть <span class="process-math">\(U\)</span> — подпространство в <span class="process-math">\(V{}\)</span>. Тогда <dfn class="terminology">факторпространством</dfn> <span class="process-math">\(V{}/U\)</span> называется множество всех сдвигов подпространства <span class="process-math">\(U\)</span>. Таким образом,</div>
<div class="displaymath process-math">
\begin{equation*}
V{}/U = \{ v + U : v \in V \}.
\end{equation*}
</div>
