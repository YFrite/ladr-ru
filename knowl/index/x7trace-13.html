<div class="para logical">
<div class="para">Предположим, <span class="process-math">\(T \in \Lc(V)\)</span>. <dfn class="terminology">след</dfn> <span class="process-math">\(T\)</span>, обозначаемый <span class="process-math">\(\tr T\)</span>, определяется формулой</div>
<div class="displaymath process-math">
\begin{equation*}
\tr T = \tr \M(  T, (v_1, \ldots, v_n)  ),
\end{equation*}
</div>
<div class="para">где <span class="process-math">\(v_1, \ldots, v_n\)</span> — любой базис <span class="process-math">\(V{}\)</span>.</div>
