<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Теорема</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.65</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">характеристический полином, след и определитель.</span>
</h2>
<div class="para logical">
<div class="para">Предположим, <span class="process-math">\(T \in \Lc(V)\)</span>. Пусть <span class="process-math">\(n = \dim V{}\)</span>. Тогда характеристический полином <span class="process-math">\(T\)</span> можно записать в виде</div>
<div class="displaymath process-math">
\begin{equation*}
z^n - (\tr T) z^{n-1} + \dots + (-1)^n (\det T).
\end{equation*}
</div>
