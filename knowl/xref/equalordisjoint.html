<span class="type">Теорема</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">3.101</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">два сдвига подпространства либо совпадают, либо не пересекаются.</span>
</h2>
<div class="para logical">
<div class="para">Пусть <span class="process-math">\(U\)</span> — подпространство в <span class="process-math">\(V\)</span> и <span class="process-math">\(v, w \in V{}\)</span>. Тогда</div>
<div class="displaymath process-math">
\begin{equation*}
v - w \in U \iff v+U =w+U \iff (v+U) \cap (w+U) \ne \emptyset.
\end{equation*}
</div>
