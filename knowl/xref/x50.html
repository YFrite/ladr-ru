<span class="type">Теорема</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.42</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">теорема Рисса о представлении.</span>
</h2>
<div class="para logical">
<div class="para">Пусть пространство <span class="process-math">\(V\)</span> конечномерно и <span class="process-math">\(\phi\)</span> — линейный функционал на <span class="process-math">\(V{}\)</span>. Тогда существует единственный вектор <span class="process-math">\(v \in V\)</span>, такой, что</div>
<div class="displaymath process-math">
\begin{equation*}
\phi(u) = \langle u,v \rangle
\end{equation*}
</div>
<div class="para">для каждого <span class="process-math">\(u \in V{}\)</span>.</div>
